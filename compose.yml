services:
  fcc:
    image: ${FCC_IMAGE:-ghcr.io/andreybrigunet/free-claude-code-docker:latest}
    container_name: fcc
    restart: unless-stopped
    network_mode: host

    environment:
      HOST: 127.0.0.1
      PORT: 8082
      FCC_OPEN_BROWSER: "false"
      MESSAGING_PLATFORM: "none"
      VOICE_NOTE_ENABLED: "false"
      PROXY_AUTH_ENABLED: "true"
      ANTHROPIC_AUTH_TOKEN: ${FCC_AUTH_TOKEN:?FCC_AUTH_TOKEN must be set in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

    volumes:
      - fcc-data:/root/.fcc

    security_opt:
      - no-new-privileges:true

  fcc-local-proxy:
    image: ${NGINX_IMAGE:-nginx:alpine}
    container_name: fcc-local-proxy
    restart: unless-stopped
    network_mode: host

    depends_on:
      - fcc

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    security_opt:
      - no-new-privileges:true

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    container_name: fcc-cloudflared
    restart: unless-stopped
    network_mode: host

    command:
      - tunnel
      - --no-autoupdate
      - run

    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN must be set in .env}

    depends_on:
      - fcc-local-proxy

    security_opt:
      - no-new-privileges:true

volumes:
  fcc-data:
    name: ${FCC_DATA_VOLUME:-fcc-data}
