name: Build FCC Docker image

on:
  push:
    branches:
      - master
    paths:
      - Dockerfile
      - .github/workflows/build.yml
  workflow_dispatch:
    inputs:
      fcc_ref:
        description: "Upstream FCC branch, tag, or commit"
        required: false
        default: "master"
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  packages: write

concurrency:
  group: fcc-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout wrapper repository
        uses: actions/checkout@v4

      - name: Resolve upstream FCC commit
        id: upstream
        shell: bash
        env:
          REQUESTED_REF: ${{ github.event.inputs.fcc_ref || 'master' }}
        run: |
          set -euo pipefail

          repo="https://github.com/Alishahryar1/free-claude-code.git"
          ref="${REQUESTED_REF}"

          tmp="$(mktemp -d)"
          git -C "$tmp" init -q
          git -C "$tmp" remote add origin "$repo"
          git -C "$tmp" fetch -q --depth 1 origin "$ref"
          sha="$(git -C "$tmp" rev-parse FETCH_HEAD)"

          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha:0:12}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/free-claude-code-docker" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=raw,value=upstream-${{ steps.upstream.outputs.short_sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            FCC_REF=${{ steps.upstream.outputs.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
