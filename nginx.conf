server {
    listen 127.0.0.1:8083;
    server_name localhost;

    client_max_body_size 25m;

    # FCC Admin - trebuie să pară complet local pentru FCC
    location /admin {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;

        proxy_set_header Host 127.0.0.1:8082;
        proxy_set_header Origin http://127.0.0.1:8082;

        # Important: nu lăsăm IP-ul real trimis de Cloudflare
        # să ajungă la Uvicorn/FCC.
        proxy_set_header X-Forwarded-For 127.0.0.1;
        proxy_set_header X-Real-IP 127.0.0.1;
        proxy_set_header Forwarded "";

        proxy_set_header CF-Connecting-IP "";
        proxy_set_header True-Client-IP "";

        proxy_buffering off;
        proxy_cache off;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # FCC API
    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;

        proxy_set_header Host 127.0.0.1:8082;
        proxy_set_header Authorization $http_authorization;

        proxy_buffering off;
        proxy_cache off;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
